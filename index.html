    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
  }

  .wall-text{
    position:absolute;
    left:0; right:0;
    top:18%;
    height:58%;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
  }
  .wall-box{
    pointer-events:auto;
    width:62%;
    max-width:260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    white-space:normal;
    word-wrap:break-word;
    overflow-wrap:break-word;
  }
  .wall-box > *{ width:100%; }
  .wall-text .w{
    display:inline;
    opacity:0;
    transform:translateY(6px);
    animation:wordIn .5s ease forwards;
  }
  @keyframes wordIn{ to{ opacity:1; transform:translateY(0); } }
  .wall-text.leaving .w{ animation:none; opacity:0; }

  .wall-quote{
    font-family:'Amiri', serif;
    font-size:clamp(12px, 3.3vw, 15px);
    line-height:1.9;
    color:var(--brown);
    text-shadow:0 1px 3px rgba(255,255,255,0.6);
  }
  .wall-flourish{ margin:10px 0; }
  .wall-flourish svg{ display:block; margin:0 auto; }
  .wall-invite p{
    font-family:'Amiri', serif;
    font-size:clamp(11px, 3.1vw, 14px);
    line-height:1.75;
    margin:2px 0;
    text-shadow:0 1px 3px rgba(255,255,255,0.6);
  }
  .wall-invite .plain{ color:var(--sage); font-size:0.9em; }
  .wall-invite .fam{ font-weight:700; color:var(--brown); }
  .wall-invite .couple{ font-weight:700; font-size:1.25em; color:var(--tan); }

  .wall-eyebrow{
    font-family:'Cairo', sans-serif;
    font-size:clamp(11px, 3vw, 13px);
    letter-spacing:0.1em;
    color:var(--sage);
    margin-bottom:10px;
  }
  .wall-couple-line{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:clamp(18px, 5vw, 24px);
    color:var(--tan);
    text-shadow:0 1px 3px rgba(255,255,255,0.6);
  }
  .wall-date{
    font-family:'Cairo', sans-serif;
    font-size:clamp(12px, 3.4vw, 14px);
    color:var(--brown);
    margin-top:10px;
  }

  .countdown{
    display:flex;
    justify-content:center;
    gap:clamp(8px, 3vw, 16px);
    direction:ltr;
    margin-top:20px;
  }
  .cd-unit{ text-align:center; min-width:38px; }
  .cd-num{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:clamp(20px, 6vw, 28px);
    font-variant-numeric:tabular-nums;
    color:var(--tan);
    text-shadow:0 1px 3px rgba(255,255,255,0.6);
  }
  .cd-label{ font-size:10px; color:var(--sage); margin-top:4px; }
  .cd-sep{ font-size:clamp(20px, 6vw, 28px); color:var(--line); }

  .wall-map{ margin-top:10px; }
  .wall-map iframe{
    width:100%; height:150px; border:0; border-radius:4px; display:block;
  }
  .map-link-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:9px 16px;
    background:var(--tan);
    color:var(--brown);
    font-weight:700;
    font-size:12px;
    border-radius:4px;
    text-decoration:none;
    position:relative;
    z-index:5;
    pointer-events:auto;
    touch-action:manipulation;
  }
  .wall-signoff{
    font-family:'Amiri', serif;
    font-style:italic;
    font-size:12px;
    color:var(--sage);
    margin-top:10px;
  }

  .scroll-hint{
    margin-top:16px;
    font-size:20px;
    color:var(--tan);
    animation:bounce 1.6s ease infinite;
  }
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

  #splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:var(--cream);
    display:flex; align-items:center; justify-content:center;
    animation:splashOut 0.7s ease 2.1s forwards;
  }
  @keyframes splashOut{ to{opacity:0; visibility:hidden; pointer-events:none;} }
  .splash-inner{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .splash-img-text{ display:block; width:min(52vw, 180px); height:auto; }
  .splash-img-line{
    display:block;
    width:min(52vw, 180px);
    height:auto;
    clip-path:inset(0 50% 0 50%);
    animation:lineGrow 1s ease 0.4s forwards;
  }
  @keyframes lineGrow{ to{ clip-path:inset(0 0 0 0); } }

  .scroll-track{ position:relative; z-index:3; }
  .scroll-block{ height:100vh; scroll-snap-align:start; pointer-events:none; }
</style>
</head>

<div class="scroll-track">
  <section class="scroll-block" data-block="greeting"></section>
  <section class="scroll-block" data-block="date"></section>
  <section class="scroll-block" data-block="location"></section>
</div>

<script>
  function wrapWords(str){
    return str.split(' ').map(function(w, i){
      return '<span class="w" style="animation-delay:' + (i * 55) + 'ms">' + w + '</span>';
    }).join(' ');
  }

  var flourishSVG = '<svg viewBox="0 0 220 20" width="120" height="12" aria-hidden="true">'
    + '<line x1="0" y1="10" x2="82" y2="10" style="stroke:var(--tan); stroke-width:1;"/>'
    + '<path d="M82 10 C 92 2, 100 2, 100 10 C 100 18, 108 18, 118 10" style="stroke:var(--tan); stroke-width:1.2; fill:none;"/>'
    + '<circle cx="100" cy="10" r="2.4" style="fill:var(--sage);"/>'
    + '<line x1="118" y1="10" x2="200" y2="10" style="stroke:var(--tan); stroke-width:1;"/>'
    + '</svg>';

  var blocks = {
    greeting: function(){
      return '<div class="wall-box">'
        + '<p class="wall-quote">' + wrapWords('وما الحُب إلا لمن أتو البيوت من أبوابها، فأعزو مقامنا، فأعززنا مقامهم بقبولاً ولين.') + '</p>'
        + '<div class="wall-flourish">' + flourishSVG + '</div>'
        + '<div class="wall-invite">'
        +   '<p class="plain">' + wrapWords('نتشرف نحن') + '</p>'
        +   '<p class="fam">' + wrapWords('آل فتح الرحمن عبدالله خليفة') + '</p>'
        +   '<p class="plain">' + wrapWords('و') + '</p>'
        +   '<p class="fam">' + wrapWords('آل عمر محمد محمود') + '</p>'
        +   '<p class="plain">' + wrapWords('بدعوتكم لمشاركتنا اجمل لحظات العمر وحضور حفل زفاف') + '</p>'
        +   '<p class="couple">' + wrapWords('السيد مصطفى') + '</p>'
        +   '<p class="plain">' + wrapWords('و') + '</p>'
        +   '<p class="couple">' + wrapWords('الدكتورة سيدة') + '</p>'
        +   '<p class="plain">' + wrapWords('لتكمل فرحتنا وحضوركم يزينه') + '</p>'
        + '</div>'
        + '<div class="scroll-hint">⌄</div>'
        + '</div>';
    },
    date: function(){
      return '<div class="wall-box">'
        + '<p class="wall-eyebrow">' + wrapWords('موعد الحفل') + '</p>'
        + '<p class="wall-date">' + wrapWords('الجمعة، 31 يوليو 2026 — الساعة 10:00 مساءً') + '</p>'
        + '<div class="countdown" id="countdown">'
        +   '<div class="cd-unit"><div class="cd-num" id="cd-days">00</div><div class="cd-label">أيام</div></div>'
        +   '<div class="cd-sep">:</div>'
        +   '<div class="cd-unit"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">ساعات</div></div>'
        +   '<div class="cd-sep">:</div>'
        +   '<div class="cd-unit"><div class="cd-num" id="cd-mins">00</div><div class="cd-label">دقائق</div></div>'
        +   '<div class="cd-sep">:</div>'
        +   '<div class="cd-unit"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">ثواني</div></div>'
        + '</div>'
        + '</div>';
    },
    location: function(){
      return '<div class="wall-box">'
        + '<p class="wall-eyebrow">' + wrapWords('مكان الحفل') + '</p>'
        + '<div class="wall-map">'
        +   '<iframe src="https://www.google.com/maps?q=16.6961279,43.0413361&z=16&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="خريطة موقع الحفل"></iframe>'
        + '</div>'
        + '<a class="map-link-btn" id="mapLinkBtn" href="https://maps.app.goo.gl/4Cu4iNinsGS4JqS2A" rel="noopener" onclick="window.location.href=\'https://maps.app.goo.gl/4Cu4iNinsGS4JqS2A\'; return false;">'
        +   '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2;"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
        +   'فتح الموقع في خرائط جوجل'
        + '</a>'
        + '<p class="wall-signoff">بكل الحب مصطفى و سيدة</p>'
        + '</div>';
    }
  };

  var wallText = document.getElementById('wallText');
  var current = null;

  function renderBlock(name){
    wallText.classList.add('leaving');
    setTimeout(function(){
      wallText.innerHTML = blocks[name]();
      wallText.classList.remove('leaving');
      var btn = document.getElementById('mapLinkBtn');
      if(btn){
        var openMap = function(){
          window.location.href = 'https://maps.app.goo.gl/4Cu4iNinsGS4JqS2A';
        };
        var touchStartX = 0, touchStartY = 0, touchHandled = false;
        btn.addEventListener('touchstart', function(e){
          touchHandled = false;
          var t = e.changedTouches[0];
          touchStartX = t.clientX;
          touchStartY = t.clientY;
        }, {passive:true});
        btn.addEventListener('touchend', function(e){
          var t = e.changedTouches[0];
          var dx = Math.abs(t.clientX - touchStartX);
          var dy = Math.abs(t.clientY - touchStartY);
          if(dx < 12 && dy < 12){
            touchHandled = true;
            e.preventDefault();
            openMap();
          }
        });
        btn.addEventListener('click', function(e){
          if(touchHandled){ e.preventDefault(); return; }
          e.preventDefault();
          openMap();
        });
      }
    }, 220);
  }

  var weddingDate = new Date("2026-07-31T22:00:00");
  function pad(n){ return String(n).padStart(2, "0"); }
  function updateCountdown(){
    var el = document.getElementById('cd-days');
    if(!el) return;
    var now = new Date();
    var diff = weddingDate - now;
    if (diff < 0) diff = 0;
    var days = Math.floor(diff / (1000*60*60*24));
    var hours = Math.floor((diff / (1000*60*60)) % 24);
    var mins = Math.floor((diff / (1000*60)) % 60);
    var secs = Math.floor((diff / 1000) % 60);
    document.getElementById("cd-days").textContent = pad(days);
    document.getElementById("cd-hours").textContent = pad(hours);
    document.getElementById("cd-mins").textContent = pad(mins);
    document.getElementById("cd-secs").textContent = pad(secs);
  }
  setInterval(updateCountdown, 1000);

  var sections = document.querySelectorAll('.scroll-block');
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6){
        var name = entry.target.getAttribute('data-block');
        if(name !== current){
          current = name;
          renderBlock(name);
          if(name === 'date'){ updateCountdown(); }
        }
      }
    });
  }, {threshold:[0.6]});

  window.addEventListener('load', function(){
    setTimeout(function(){
      current = 'greeting';
      renderBlock('greeting');
      sections.forEach(function(s){ observer.observe(s); });
    }, 2300);
  });

  var bgm = document.getElementById('bgm');
  var soundToggle = document.getElementById('soundToggle');
  bgm.volume = 0.32;

  function startMusic(){
    bgm.play().catch(function(){});
    document.removeEventListener('click', startMusic);
    document.removeEventListener('touchstart', startMusic);
    document.removeEventListener('touchend', startMusic);
    document.removeEventListener('scroll', startMusic);
  }
  document.addEventListener('click', startMusic);
  document.addEventListener('touchstart', startMusic);
  document.addEventListener('touchend', startMusic);
  document.addEventListener('scroll', startMusic, {passive:true});

  soundToggle.addEventListener('click', function(e){
    e.stopPropagation();
    if(bgm.muted){
      bgm.muted = false;
      soundToggle.classList.remove('muted');
      bgm.play().catch(function(){});
    } else {
      bgm.muted = true;
      soundToggle.classList.add('muted');
    }
  });
</script>

</body>
</html>
